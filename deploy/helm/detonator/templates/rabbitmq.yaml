apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "detonator.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  type: NodePort
  selector:
    {{- include "detonator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
  ports:
    - name: amqp
      port: 5672
      nodePort: {{ .Values.rabbitmq.nodePort }}
    - name: management
      port: 15672
      nodePort: {{ .Values.rabbitmq.managementNodePort }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  labels:
    {{- include "detonator.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
data:
  # Per-queue metrics (depth, consumers) instead of totals only.
  90-prometheus.conf: |
    prometheus.return_per_object_metrics = true
---
# A StatefulSet gives the pod a stable hostname (rabbitmq-0), which RabbitMQ
# uses as its node name; its data directory is tied to that name.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "detonator.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "detonator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "detonator.labels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "15692"
    spec:
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: detonator
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: detonator-credentials, key: rabbitmq-password}
          ports:
            - containerPort: 5672
            - containerPort: 15672
            - containerPort: 15692 # Prometheus metrics
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, check_port_connectivity]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 15
          resources: {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/90-prometheus.conf
              subPath: 90-prometheus.conf
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage }}
