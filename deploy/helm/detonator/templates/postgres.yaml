apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "detonator.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: NodePort
  selector:
    {{- include "detonator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      nodePort: {{ .Values.postgres.nodePort }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "detonator.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "detonator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "detonator.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: detonator
            - name: POSTGRES_DB
              value: detonator
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: detonator-credentials, key: postgres-password}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, detonator, -d, detonator]
            periodSeconds: 10
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
