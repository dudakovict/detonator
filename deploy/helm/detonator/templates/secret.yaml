{{- /*
Passwords are generated on first install and reused on every upgrade (lookup
reads the existing Secret), so they never live in git or in values files.
"keep" stops `helm uninstall` from deleting them along with the data.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "detonator-credentials").data | default dict }}
{{- $pg := index $existing "postgres-password" | default (randAlphaNum 32 | b64enc) }}
{{- $mq := index $existing "rabbitmq-password" | default (randAlphaNum 32 | b64enc) }}
{{- $ak := index $existing "s3-access-key" | default (randAlphaNum 20 | b64enc) }}
{{- $sk := index $existing "s3-secret-key" | default (randAlphaNum 40 | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: detonator-credentials
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ $pg }}
  rabbitmq-password: {{ $mq }}
  s3-access-key: {{ $ak }}
  s3-secret-key: {{ $sk }}
---
# SeaweedFS reads its S3 users from a JSON file; built from the same keys.
apiVersion: v1
kind: Secret
metadata:
  name: objectstore-s3-config
type: Opaque
stringData:
  s3.json: |
    {"identities": [{"name": "detonator",
      "credentials": [{"accessKey": "{{ $ak | b64dec }}", "secretKey": "{{ $sk | b64dec }}"}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
