apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "detonator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    {{- include "detonator.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: {{ .Values.api.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "detonator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "detonator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "detonator.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ required "api.image.tag is required" .Values.api.image.tag }}"
          imagePullPolicy: IfNotPresent # loaded into the node by `make deploy`, not pulled
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: detonator-credentials, key: postgres-password}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef: {name: detonator-credentials, key: rabbitmq-password}
            # $(VAR) expands variables defined earlier in this list.
            - name: DATABASE_URL
              value: postgresql://detonator:$(POSTGRES_PASSWORD)@postgres:5432/detonator
            - name: AMQP_URL
              value: amqp://detonator:$(RABBITMQ_PASSWORD)@rabbitmq:5672/%2F
            - name: S3_ENDPOINT
              value: http://objectstore:8333
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: detonator-credentials, key: s3-access-key}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: detonator-credentials, key: s3-secret-key}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 90
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp # uploads larger than 1 MB are spooled to /tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
