{{- /* Generated on first install, reused on upgrades (same pattern as detonator-credentials). */ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "elk-credentials").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: elk-credentials
  labels:
    {{- include "observability.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Superuser: log in to Kibana with "elastic" and this password.
  elastic-password: {{ index $existing "elastic-password" | default (randAlphaNum 32 | b64enc) }}
  # Built-in user Kibana uses to talk to Elasticsearch.
  kibana-system-password: {{ index $existing "kibana-system-password" | default (randAlphaNum 32 | b64enc) }}
  # Filebeat's own user, allowed only to set up and write filebeat-* data.
  filebeat-password: {{ index $existing "filebeat-password" | default (randAlphaNum 32 | b64enc) }}
  kibana-encryption-key: {{ index $existing "kibana-encryption-key" | default (randAlphaNum 32 | b64enc) }}
