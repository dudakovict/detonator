apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: filebeat
data:
  filebeat.yml: |
    filebeat.inputs:
      # Every container's stdout/stderr, enriched with pod, namespace and labels.
      - type: filestream
        id: kubernetes-containers
        paths: [/var/log/containers/*.log]
        prospector.scanner.symlinks: true
        parsers:
          - container: ~
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: /var/log/containers/

      # The workers and the sinkhole run under systemd on the node. The workers
      # log one JSON object per line; decode it into the "detonator" field.
      - type: journald
        id: node-services
        paths: [/var/log/journal]
        processors:
          - drop_event:
              when.not.regexp.systemd.unit: '^(detonator-worker@.+|sinkhole)\.service$'
          - decode_json_fields:
              when.regexp.systemd.unit: '^detonator-worker@'
              fields: [message]
              target: detonator

      # Every DNS query and HTTP request sandbox VMs sent to the fake internet.
      - type: filestream
        id: sinkhole-events
        paths: [/var/log/sinkhole/events.jsonl]
        parsers:
          - ndjson:
              target: sinkhole
              add_error_key: true

    setup.ilm.policy_name: detonator-logs
    setup.ilm.check_exists: true
    output.elasticsearch:
      hosts: ["http://elasticsearch:9200"]
      username: filebeat
      password: ${FILEBEAT_PASSWORD}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: filebeat
---
# Read-only, for add_kubernetes_metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-filebeat
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: filebeat
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-filebeat
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: filebeat
subjects:
  - kind: ServiceAccount
    name: filebeat
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-filebeat
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: filebeat
spec:
  selector:
    matchLabels:
      {{- include "observability.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: filebeat
  template:
    metadata:
      labels:
        {{- include "observability.labels" . | nindent 8 }}
        app.kubernetes.io/component: filebeat
      annotations:
        checksum/config: {{ .Values.elk | toJson | cat (.Files.Get "templates/elk-filebeat.yaml") | sha256sum | trunc 12 }}
    spec:
      serviceAccountName: filebeat
      containers:
        - name: filebeat
          image: elastic/filebeat:{{ .Values.elk.version }}
          args: [-e, -c, /etc/filebeat.yml]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: FILEBEAT_PASSWORD
              valueFrom: {secretKeyRef: {name: elk-credentials, key: filebeat-password}}
          # Reading the host's logs needs root and, under SELinux, the
          # "super privileged container" type; nothing is written to the host
          # except Filebeat's own read positions.
          securityContext:
            runAsUser: 0
            seLinuxOptions:
              type: spc_t
          resources: {{- toYaml .Values.elk.filebeat.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/filebeat.yml, subPath: filebeat.yml, readOnly: true}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: machine-id, mountPath: /etc/machine-id, readOnly: true}
            - {name: data, mountPath: /usr/share/filebeat/data}
      volumes:
        - name: config
          configMap: {name: filebeat-config}
        - name: varlog
          hostPath: {path: /var/log}
        - name: machine-id
          hostPath: {path: /etc/machine-id, type: File}
        - name: data
          hostPath: {path: /var/lib/filebeat-data, type: DirectoryOrCreate}
