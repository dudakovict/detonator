- name: Create the k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Configure k3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Check the installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  failed_when: false
  changed_when: false

- name: Download the k3s installer for this version
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/k3s-io/k3s/{{ k3s_version }}/install.sh"
    dest: /usr/local/sbin/k3s-install.sh
    mode: "0755"
  when: k3s_version not in k3s_installed.stdout | default('')

# The installer fetches the pinned binary, verifies its checksum, adds the
# k3s-selinux policy and creates the systemd service.
- name: Install k3s
  ansible.builtin.command: /usr/local/sbin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when: k3s_version not in k3s_installed.stdout | default('')
  changed_when: true

- name: Start k3s
  ansible.builtin.systemd_service:
    name: k3s.service
    enabled: true
    state: started

- name: Wait for the node to be ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Read the cluster's admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Write the kubeconfig on the workstation
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ k3s_node_ip ~ ':6443') }}"
    dest: "{{ kubeconfig_dest }}"
    mode: "0600"
  delegate_to: localhost
  become: false
